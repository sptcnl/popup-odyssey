version: "3.8"

services:
  nginx:
    image: nginx:alpine
    container_name: popup_nginx
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - ./nginx:/etc/nginx/templates

    ports:
      - "80:80"

    command: >
      /bin/sh -c "envsubst < /etc/nginx/templates/default.conf.template
      > /etc/nginx/conf.d/default.conf &&
      nginx -g 'daemon off;'"