services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${LOCAL_DB_NAME}
      POSTGRES_USER: ${LOCAL_DB_USER}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD}
    ports:
      - "${LOCAL_DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER} -d ${LOCAL_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  django:
    build:
      context: .
      dockerfile: Dockerfile.conda
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://${LOCAL_DB_USER}:${LOCAL_DB_PASSWORD}@db:5432/${LOCAL_DB_NAME}
    expose:
      - "8000"
    volumes:
      - .:/app

  popup-crawler:
    build:
      context: .
      dockerfile: Dockerfile.crawler
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${LOCAL_DB_USER}:${LOCAL_DB_PASSWORD}@db:5432/${LOCAL_DB_NAME}
    volumes:
      - ./data:/app/data
      - /tmp:/tmp
      - ./data/images:/app/data/images
    env_file:
      - ./.env
    restart: unless-stopped
    profiles:
      - crawler

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    depends_on:
      - django
    volumes:
      - ./nginx/nginx.conf.template:/nginx.conf.template
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    command: >
      /bin/sh -c "
      envsubst '$$DUCKDNS_SUBDOMAIN' < /nginx.conf.template > /etc/nginx/conf.d/default.conf &&
      nginx -g 'daemon off;'
      "
    restart: unless-stopped


  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM;
      while :; do
        certbot renew;
        sleep 12h;
      done"

  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    environment:
      - SUBDOMAINS=${DUCKDNS_SUBDOMAIN}
      - TOKEN=${DUCKDNS_TOKEN}
      - TZ=Asia/Seoul
    restart: unless-stopped

volumes:
  postgres_data: